name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      # CPU wheel first: the default Linux torch wheel drags in ~2 GB of CUDA libraries
      # that CI never uses. requirements.txt then sees the pin already satisfied.
      - run: pip install "torch==$(grep '^torch==' requirements.txt | cut -d= -f3)" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: pytest -m "not slow" -q
